<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">MarketCraft AI 统一产品入口预览</title>
  <desc id="desc">展示统一侧边栏、对话任务入口、完整商品链路、Skill 插件和外部服务模块</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#183d2d" flood-opacity=".09"/></filter><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b4734"/><stop offset="1" stop-color="#327559"/></linearGradient><style>.ui{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.serif{font-family:Georgia,"Songti SC",serif}.muted{fill:#6b756e}.tiny{font-size:10px;letter-spacing:1.3px}.small{font-size:12px}.body{font-size:14px}.heading{fill:#17211b;font-weight:700}</style></defs>
  <rect width="1440" height="900" fill="#f3f5f1"/><circle cx="1310" cy="0" r="280" fill="#d9f06f" opacity=".12"/>
  <g class="ui">
    <rect width="244" height="900" fill="#093d2e"/><rect x="23" y="25" width="42" height="42" rx="12" fill="#d9f06f"/><text x="44" y="53" text-anchor="middle" font-size="20" font-weight="800" fill="#093d2e">M</text><text x="78" y="46" font-size="17" font-weight="700" fill="#fff">MarketCraft</text><text x="78" y="62" class="tiny" fill="#fff" opacity=".43">AI COMMERCE OS</text>
    <rect x="18" y="111" width="208" height="42" rx="9" fill="#fff" opacity=".1"/><text x="35" y="137" class="body" fill="#fff"><tspan fill="#d9f06f">⌂</tspan>　AI 工作台</text><text x="27" y="183" font-size="8" fill="#fff" opacity=".3">创作与发布</text><text x="35" y="218" class="small" fill="#fff" opacity=".65">✦　商品创作</text><text x="35" y="258" class="small" fill="#fff" opacity=".65">◉　竞品分析</text><text x="35" y="298" class="small" fill="#fff" opacity=".65">▣　海报设计</text><text x="35" y="338" class="small" fill="#fff" opacity=".65">⇧　审核与上架</text><text x="27" y="377" font-size="8" fill="#fff" opacity=".3">经营与系统</text><text x="35" y="412" class="small" fill="#fff" opacity=".65">⌁　经营优化</text><text x="35" y="452" class="small" fill="#fff" opacity=".65">↗　订单与库存</text><text x="35" y="492" class="small" fill="#fff" opacity=".65">◇　Skill 插件</text><rect x="193" y="476" width="25" height="18" rx="9" fill="#d9f06f"/><text x="205" y="489" text-anchor="middle" font-size="8" font-weight="800" fill="#345023">7</text><text x="35" y="532" class="small" fill="#fff" opacity=".65">⌘　外部服务</text><rect x="193" y="516" width="25" height="18" rx="9" fill="#d9f06f"/><text x="205" y="529" text-anchor="middle" font-size="8" font-weight="800" fill="#345023">7</text>
    <rect x="18" y="728" width="208" height="145" rx="14" fill="#fff" opacity=".07" stroke="#fff" stroke-opacity=".13"/><text x="34" y="757" class="tiny" fill="#fff" opacity=".35">CURRENT ENVIRONMENT</text><circle cx="38" cy="785" r="4" fill="#65c47d"/><text x="51" y="789" class="small" font-weight="700" fill="#fff">安全演示环境</text><text x="34" y="820" class="small" fill="#fff" opacity=".48">真实写操作必须人工审核</text><rect x="34" y="840" width="76" height="21" rx="11" fill="#d9f06f"/><text x="72" y="855" text-anchor="middle" font-size="8" font-weight="800" fill="#4f631c">MOCK MODE</text>

    <g transform="translate(288 30)"><text class="tiny muted">CONVERSATIONAL COMMERCE WORKSPACE</text><text y="47" class="serif" font-size="39" fill="#17211b">AI 电商工作台</text><text y="73" class="body muted">用一句话发起任务，也可以进入任意专业模块继续编辑。</text><rect x="966" y="8" width="115" height="36" rx="9" fill="#fff" stroke="#dfe6e0"/><circle cx="985" cy="26" r="4" fill="#65c47d"/><text x="998" y="30" class="small muted">系统正常</text></g>
    <g transform="translate(288 126)" filter="url(#shadow)"><rect width="1104" height="335" rx="20" fill="url(#hero)"/><circle cx="1020" cy="65" r="220" fill="#d9f06f" opacity=".08"/><text x="38" y="46" class="tiny" font-weight="800" fill="#d9f06f" opacity=".7">MARKETCRAFT AGENT</text><text x="38" y="93" class="serif" font-size="37" fill="#fff">今天想让 AI 帮你完成什么？</text><text x="38" y="124" class="body" fill="#fff" opacity=".62">从一张商品图开始，规划素材、竞品、海报、审核上架与数据复盘。</text><rect x="38" y="153" width="1028" height="118" rx="14" fill="#fff"/><text x="57" y="184" class="small muted">上传这件夹克，生成模特试穿图和 TikTok 海报，然后准备上架草稿……</text><line x1="45" y1="221" x2="1059" y2="221" stroke="#e8ece8"/><text x="57" y="250" class="tiny muted">当前只生成执行计划，不直接调用外部写操作</text><rect x="887" y="229" width="160" height="34" rx="8" fill="#15583f"/><text x="967" y="251" text-anchor="middle" class="small" font-weight="700" fill="#fff">发送给 Agent　→</text><g transform="translate(38 287)"><rect width="114" height="28" rx="14" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".18"/><text x="57" y="19" text-anchor="middle" font-size="9" fill="#fff">生成商品素材</text><rect x="123" width="102" height="28" rx="14" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".18"/><text x="174" y="19" text-anchor="middle" font-size="9" fill="#fff">分析竞品</text><rect x="234" width="102" height="28" rx="14" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".18"/><text x="285" y="19" text-anchor="middle" font-size="9" fill="#fff">准备上架</text><rect x="345" width="128" height="28" rx="14" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".18"/><text x="409" y="19" text-anchor="middle" font-size="9" fill="#fff">分析经营数据</text></g></g>
    <g transform="translate(288 479)" filter="url(#shadow)"><rect width="665" height="376" rx="15" fill="#fff" stroke="#dfe6e0"/><text x="19" y="30" class="tiny muted">END-TO-END WORKFLOW</text><text x="19" y="57" font-size="18" class="heading">完整商品增长链路</text><rect x="575" y="24" width="69" height="22" rx="11" fill="#e3f5ea"/><text x="609" y="39" text-anchor="middle" font-size="8" font-weight="800" fill="#15583f">5 MODULES</text><g transform="translate(17 84)">
      <g><rect width="119" height="130" rx="11" fill="#fafbf9" stroke="#dfe6e0"/><text x="13" y="24" class="tiny" fill="#78a089">01</text><text x="13" y="61" class="small heading">商品素材</text><text x="13" y="84" font-size="9" class="muted">多角度图</text><text x="13" y="101" font-size="9" class="muted">模特试穿</text><text x="124" y="68" font-size="16" fill="#a7b1aa">→</text></g><g transform="translate(129)"><rect width="119" height="130" rx="11" fill="#fafbf9" stroke="#dfe6e0"/><text x="13" y="24" class="tiny" fill="#78a089">02</text><text x="13" y="61" class="small heading">竞品洞察</text><text x="13" y="84" font-size="9" class="muted">视觉拆解</text><text x="13" y="101" font-size="9" class="muted">原创 Brief</text><text x="124" y="68" font-size="16" fill="#a7b1aa">→</text></g><g transform="translate(258)"><rect width="119" height="130" rx="11" fill="#fafbf9" stroke="#dfe6e0"/><text x="13" y="24" class="tiny" fill="#78a089">03</text><text x="13" y="61" class="small heading">海报设计</text><text x="13" y="84" font-size="9" class="muted">可编辑图层</text><text x="13" y="101" font-size="9" class="muted">多尺寸导出</text><text x="124" y="68" font-size="16" fill="#a7b1aa">→</text></g><g transform="translate(387)"><rect width="119" height="130" rx="11" fill="#fafbf9" stroke="#dfe6e0"/><text x="13" y="24" class="tiny" fill="#78a089">04</text><text x="13" y="61" class="small heading">审核上架</text><text x="13" y="84" font-size="9" class="muted">平台草稿</text><text x="13" y="101" font-size="9" class="muted">四眼审批</text><text x="124" y="68" font-size="16" fill="#a7b1aa">→</text></g><g transform="translate(516)"><rect width="119" height="130" rx="11" fill="#fafbf9" stroke="#dfe6e0"/><text x="13" y="24" class="tiny" fill="#78a089">05</text><text x="13" y="61" class="small heading">数据回流</text><text x="13" y="84" font-size="9" class="muted">指标分析</text><text x="13" y="101" font-size="9" class="muted">优化建议</text></g></g><rect x="17" y="233" width="631" height="121" rx="11" fill="#f7faf7" stroke="#e0e8e1"/><text x="34" y="260" class="tiny muted">AGENT EXECUTION PLAN</text><text x="34" y="287" class="small heading">理解目标 → 调用 Skill → 生成草稿 → 等待人工确认</text><rect x="34" y="308" width="142" height="28" rx="8" fill="#15583f"/><text x="105" y="327" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">打开第一个模块</text><text x="193" y="327" font-size="9" class="muted">发布、库存、履约操作不会自动越权执行</text></g>
    <g transform="translate(970 479)" filter="url(#shadow)"><rect width="422" height="376" rx="15" fill="#fff" stroke="#dfe6e0"/><text x="19" y="30" class="tiny muted">EXTENSIBLE RUNTIME</text><text x="19" y="57" font-size="18" class="heading">可插拔能力</text><g transform="translate(17 82)"><rect width="119" height="109" rx="10" fill="#fafbf9" stroke="#dfe6e0"/><text x="13" y="33" font-size="22" font-weight="700" fill="#15583f">7</text><text x="13" y="59" class="small heading">Skill 插件</text><text x="13" y="80" font-size="8" class="muted">创建 · 编辑 · 启停</text><rect x="129" width="119" height="109" rx="10" fill="#fafbf9" stroke="#dfe6e0"/><text x="142" y="33" font-size="22" font-weight="700" fill="#15583f">7</text><text x="142" y="59" class="small heading">外部服务</text><text x="142" y="80" font-size="8" class="muted">接口 · 能力 · 密钥引用</text><rect x="258" width="130" height="109" rx="10" fill="#fafbf9" stroke="#dfe6e0"/><text x="271" y="33" font-size="17" font-weight="700" fill="#15583f">4-EYES</text><text x="271" y="59" class="small heading">写操作审批</text><text x="271" y="80" font-size="8" class="muted">提交人与审核人分离</text></g><rect x="17" y="207" width="388" height="72" rx="10" fill="#eaf6ed" stroke="#cfe7d5"/><circle cx="37" cy="228" r="4" fill="#58b777"/><text x="50" y="232" class="small heading">Skill 自动修订后回到草稿态</text><text x="37" y="255" font-size="9" class="muted">重新启用后才进入调用路由，避免静默修改执行逻辑。</text><rect x="17" y="291" width="388" height="67" rx="10" fill="#fff9e9" stroke="#ecd99f"/><circle cx="37" cy="313" r="4" fill="#d2942f"/><text x="50" y="317" class="small" font-weight="700" fill="#715013">Mock / Live 边界明确</text><text x="37" y="340" font-size="9" fill="#715013">Live 配置未联调时保持 PENDING，不虚构连接成功。</text></g>
  </g>
</svg>
