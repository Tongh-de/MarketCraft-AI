      <text x="18" y="305" class="tiny muted">GB · 1 个 SKU</text>
      <rect x="205" y="276" width="66" height="23" rx="12" fill="#eaf3fb"/>
      <text x="238" y="291" text-anchor="middle" font-size="9" fill="#31587b">Amazon</text>
      <text x="325" y="291" class="small" fill="#17211b">预占库存并履约</text>
      <rect x="505" y="276" width="65" height="23" rx="12" fill="#e1f3e8"/>
      <text x="538" y="291" text-anchor="middle" font-size="9" fill="#266343">已完成</text>
      <rect x="630" y="276" width="47" height="23" rx="12" fill="#edf2ee"/>
      <text x="653" y="291" text-anchor="middle" font-size="9" fill="#567064">正常</text>
