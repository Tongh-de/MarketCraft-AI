    <g transform="translate(295 676)" filter="url(#shadow)">
      <rect width="1090" height="184" rx="16" fill="#ffffff" stroke="#dfe5df"/>
      <text x="22" y="29" class="tiny muted">RUN 7BE8…A21F</text>
      <text x="22" y="57" font-size="20" class="heading">AMZ-2026-0812 · 预占库存并履约</text>
