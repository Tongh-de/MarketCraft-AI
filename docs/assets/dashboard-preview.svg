      <rect x="20" y="249" width="297" height="38" rx="8" fill="#fbfcfa" stroke="#d8dfd9"/>
      <text x="33" y="273" class="small">OPS-CUP-001</text>
      <rect x="20" y="302" width="297" height="40" rx="9" fill="#235c45"/>
      <text x="168" y="327" text-anchor="middle" class="small" font-weight="700" fill="#ffffff">创建并运行 Agent</text>
