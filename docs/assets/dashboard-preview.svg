<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">MarketCraft AI 跨境电商运营控制台预览</title>
  <desc id="desc">展示运营指标、订单任务、库存与审批操作的控制台界面</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#21362a" flood-opacity="0.08"/>
    </filter>
    <style>
      .ui { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: Georgia, "Songti SC", serif; }
      .muted { fill: #69736d; }
      .tiny { font-size: 10px; letter-spacing: 1.5px; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .label { font-size: 11px; font-weight: 700; }
      .heading { fill: #17211b; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f3f5f1"/>
  <circle cx="1270" cy="50" r="260" fill="#d9f06f" opacity="0.12"/>

  <g class="ui">
    <rect width="245" height="900" fill="#153c2e"/>
    <rect x="28" y="28" width="42" height="42" rx="12" fill="#d9f06f"/>
    <text x="49" y="56" text-anchor="middle" font-size="20" font-weight="800" fill="#174532">M</text>
    <text x="83" y="48" font-size="17" font-weight="700" fill="#ffffff">MarketCraft</text>
    <text x="83" y="64" class="tiny" fill="#ffffff" opacity="0.48">AI OPERATIONS</text>

    <rect x="20" y="122" width="205" height="44" rx="10" fill="#ffffff" opacity="0.1"/>
    <text x="37" y="149" class="tiny" fill="#ffffff" opacity="0.35">01</text>
    <text x="69" y="149" class="body" fill="#ffffff">运营总览</text>
    <text x="37" y="196" class="tiny" fill="#ffffff" opacity="0.35">02</text>
    <text x="69" y="196" class="body" fill="#ffffff" opacity="0.7">订单履约</text>
    <text x="37" y="243" class="tiny" fill="#ffffff" opacity="0.35">03</text>
    <text x="69" y="243" class="body" fill="#ffffff" opacity="0.7">新建任务</text>
    <text x="37" y="290" class="tiny" fill="#ffffff" opacity="0.35">04</text>
    <text x="69" y="290" class="body" fill="#ffffff" opacity="0.7">API 文档</text>

    <rect x="20" y="727" width="205" height="145" rx="14" fill="#ffffff" opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="37" y="752" class="tiny" fill="#ffffff" opacity="0.38">CURRENT ENVIRONMENT</text>
    <circle cx="40" cy="779" r="4" fill="#7ad38d"/>
