      <text x="538" y="145" text-anchor="middle" font-size="9" fill="#8f5a0c">待审核</text>
      <rect x="630" y="130" width="47" height="23" rx="12" fill="#edf2ee"/>
      <text x="653" y="145" text-anchor="middle" font-size="9" fill="#567064">正常</text>

      <line x1="0" y1="184" x2="735" y2="184" stroke="#edf0ed"/>
      <text x="18" y="213" class="small heading">TTS-2026-0341</text>
      <text x="18" y="233" class="tiny muted">SG · 1 个 SKU</text>
      <rect x="205" y="204" width="87" height="23" rx="12" fill="#eaf3fb"/>
      <text x="249" y="219" text-anchor="middle" font-size="9" fill="#31587b">TikTok Shop</text>
      <text x="325" y="219" class="small" fill="#17211b">创建补货任务</text>
      <rect x="505" y="204" width="65" height="23" rx="12" fill="#e1f3e8"/>
      <text x="538" y="219" text-anchor="middle" font-size="9" fill="#266343">已完成</text>
      <rect x="630" y="204" width="63" height="23" rx="12" fill="#fae8e5"/>
      <text x="662" y="219" text-anchor="middle" font-size="9" fill="#994239">2 项风险</text>

      <line x1="0" y1="256" x2="735" y2="256" stroke="#edf0ed"/>
