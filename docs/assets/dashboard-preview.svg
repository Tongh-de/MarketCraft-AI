    <text x="37" y="807" class="small" fill="#ffffff" opacity="0.52">平台、ERP 与飞书使用</text>
    <text x="37" y="825" class="small" fill="#ffffff" opacity="0.52">确定性 Mock 适配器</text>
    <rect x="37" y="840" width="78" height="20" rx="10" fill="#d9f06f"/>
    <text x="76" y="854" text-anchor="middle" font-size="9" font-weight="800" fill="#52631c">MOCK MODE</text>

    <g transform="translate(295 38)">
