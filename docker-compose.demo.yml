services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      APP_ENV: production-demo
      LOG_LEVEL: INFO
      GENERATION_MODE: mock
      RETRIEVAL_MODE: memory
      PERSISTENCE_MODE: memory
      IDEMPOTENCY_MODE: memory
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_BYTES: 10485760
      WECHAT_MODE: mock
    volumes:
      - marketcraft_uploads:/app/data/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  marketcraft_uploads:

