[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketcraft-ai"
version = "0.1.0"
description = "Agentic e-commerce marketing content production platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "langgraph>=0.2,<2.0",
  "langchain-openai>=0.3,<2.0",
  "openai>=2.45,<4.0",
  "prometheus-client>=0.20,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "redis>=5.0,<8.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
]
rag = [
  "pymilvus[milvus_lite]>=2.6,<4.0",
  "sentence-transformers>=3.0,<6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
