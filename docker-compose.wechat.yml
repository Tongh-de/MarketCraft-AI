services:
  api:
    environment:
      WECHAT_MODE: ${WECHAT_MODE:-live}
      WECHAT_APP_ID: ${WECHAT_APP_ID:?set WECHAT_APP_ID in .env}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:?set WECHAT_APP_SECRET in .env}
      WECHAT_API_BASE: ${WECHAT_API_BASE:-https://api.weixin.qq.com}
      WECHAT_TIMEOUT_SECONDS: ${WECHAT_TIMEOUT_SECONDS:-20}
      PERSISTENCE_MODE: database
      DATABASE_URL: sqlite+pysqlite:////app/data/uploads/marketcraft.db
